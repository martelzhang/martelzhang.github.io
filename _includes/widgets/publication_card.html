{% assign publications = include.publications %}
<div class="my-3 p-0 rounded-xl">
    <h6 class="border-bottom border-gray px-4 pt-4 pb-3 mb-0">
        {% if include.title %}{{ include.title }}{% else %}Publications{% endif %}
    </h6>
    {% for item in publications limit:include.limit %}
        {% include widgets/publication_item.html item=item hide_bottom_border=forloop.last first=false last=false %}
    {% endfor %}
</div>
